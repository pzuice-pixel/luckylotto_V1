<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>럭키 로또 프리미엄</title>
    <style>
        :root {
            --gold: #ffcf4d;
            --neon: #00f2ff;
        }

        body {
            margin: 0;
            background: #020617;
            font-family: -apple-system, 'Pretendard', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
        }

        .header-area {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #win-text {
            text-align: center;
            opacity: 0;
            transform: translateY(20px) scale(0.8);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #win-text.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #win-text h2 {
            font-size: 1.8rem;
            margin: 0;
            line-height: 1.4;
            background: linear-gradient(to bottom, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 207, 77, 0.5));
        }

        .machine-wrap {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 10px 0;
        }

        .machine {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5), 0 0 20px rgba(0,242,255,0.1);
            overflow: hidden;
            position: relative;
        }

        .inner-ball {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3);
        }

        .result-box {
            display: flex;
            gap: 8px;
            min-height: 55px;
            margin: 25px 0;
            perspective: 1000px;
            justify-content: center;
            width: 100%;
            max-width: 360px;
        }

        .ball {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: rotateY(90deg) scale(0);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ball.active { transform: rotateY(0) scale(1); }

        .yellow { background: radial-gradient(circle at 30% 30%, #ffd93d, #f39c12); }
        .blue   { background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe); }
        .red    { background: radial-gradient(circle at 30% 30%, #ff5f6d, #ffc371); }
        .grey   { background: radial-gradient(circle at 30% 30%, #bdc3c7, #2c3e50); }
        .green  { background: radial-gradient(circle at 30% 30%, #42e695, #3bb2b8); }

        #draw-btn {
            padding: 16px 50px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #000;
            background: #fff;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            z-index: 101;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent;
        }

        #draw-btn:active { transform: scale(0.95); }
        #draw-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        @keyframes shake {
            0%, 100% { transform: translate(0,0); }
            25% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); }
            75% { transform: translate(2px, 2px); }
        }
        .shaking { animation: shake 0.1s infinite; }

        #fireworks {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 90;
        }
    </style>
</head>
<body>

    <canvas id="fireworks"></canvas>

    <div class="header-area">
        <div id="win-text">
            <h2>🎉 1등 당첨을<br>진심으로 축하드립니다!</h2>
        </div>
    </div>

    <div class="machine-wrap" id="machine-parent">
        <div class="machine" id="machine-body"></div>
    </div>

    <div class="result-box" id="result-display"></div>

    <button id="draw-btn">번호 추첨하기</button>

<script>
    const machine = document.getElementById('machine-body');
    const resultBox = document.getElementById('result-display');
    const drawBtn = document.getElementById('draw-btn');
    const winText = document.getElementById('win-text');
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');

    const colors = ['#ffd93d', '#4facfe', '#ff5f6d', '#bdc3c7', '#42e695'];
    let idleBalls = [];
    let isCelebrating = false;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for(let i=0; i<45; i++) {
        const b = document.createElement('div');
        b.className = 'inner-ball';
        b.style.backgroundColor = colors[Math.floor(i/10)] || colors[4];
        machine.appendChild(b);
        idleBalls.push({
            el: b,
            x: Math.random() * 210,
            y: Math.random() * 210,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4
        });
    }

    function update() {
        idleBalls.forEach(b => {
            b.x += b.vx; b.y += b.vy;
            if(b.x < 0 || b.x > 216) b.vx *= -1;
            if(b.y < 0 || b.y > 216) b.vy *= -1;
            b.el.style.transform = `translate3d(${b.x}px, ${b.y}px, 0)`;
        });
        requestAnimationFrame(update);
    }
    update();

    function getColClass(n) {
        if(n <= 10) return 'yellow'; if(n <= 20) return 'blue';
        if(n <= 30) return 'red'; if(n <= 40) return 'grey'; return 'green';
    }

    async function startLotto() {
        isCelebrating = false;
        drawBtn.disabled = true;
        resultBox.innerHTML = '';
        winText.classList.remove('show');
        particles = []; 
        
        document.getElementById('machine-parent').classList.add('shaking');
        idleBalls.forEach(b => { b.vx *= 4; b.vy *= 4; });

        let nums = [];
        while(nums.length < 6) {
            let n = Math.floor(Math.random() * 45) + 1;
            if(!nums.includes(n)) nums.push(n);
        }

        for(let i=0; i<6; i++) {
            await new Promise(r => setTimeout(r, 1000)); 
            const ball = document.createElement('div');
            ball.className = `ball ${getColClass(nums[i])}`;
            ball.innerText = nums[i];
            ball.dataset.num = nums[i];
            resultBox.appendChild(ball);
            setTimeout(() => ball.classList.add('active'), 50);
        }

        document.getElementById('machine-parent').classList.remove('shaking');
        idleBalls.forEach(b => { b.vx /= 4; b.vy /= 4; });

        setTimeout(() => {
            const sorted = [...resultBox.children].sort((a,b) => a.dataset.num - b.dataset.num);
            resultBox.innerHTML = '';
            sorted.forEach(b => resultBox.appendChild(b));

            setTimeout(() => {
                winText.classList.add('show');
                burstConfetti();
                isCelebrating = true; 
                drawBtn.disabled = false;
            }, 800);
        }, 1000);
    }

    drawBtn.addEventListener('click', startLotto);

    let particles = [];
    const particleColors = ['#ffcf4d', '#ff5f6d', '#4facfe', '#42e695', '#ffffff', '#f39c12'];

    function burstConfetti() {
        for (let i = 0; i < 60; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                size: Math.random() * 6 + 4,
                color: particleColors[Math.floor(Math.random() * particleColors.length)],
                vx: (Math.random() - 0.5) * 12, 
                vy: (Math.random() - 0.7) * 12, 
                angle: Math.random() * 360,
                spin: Math.random() * 10 - 5
            });
        }
    }

    function createConfetti() {
        if(!isCelebrating) return;
        if (Math.random() > 0.15) return; 

        particles.push({
            x: Math.random() * canvas.width,
            y: -20,
            size: Math.random() * 5 + 3,
            color: particleColors[Math.floor(Math.random() * particleColors.length)],
            vx: (Math.random() - 0.5) * 1.5,
            // 낙하 속도를 이전 대비 50% 수준인 0.5~0.75 정도로 낮춤
            vy: Math.random() * 0.75 + 0.5, 
            angle: Math.random() * 360,
            spin: Math.random() * 4 - 2 // 회전도 조금 더 천천히
        });
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (isCelebrating) createConfetti();

        particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;
            // 가속도(중력)를 기존 0.02에서 0.01로 50% 감소
            p.vy += 0.01; 
            p.angle += p.spin;
            
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle * Math.PI / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
            ctx.restore();

            if (p.y > canvas.height + 20) particles.splice(i, 1);
        });

        requestAnimationFrame(render);
    }
    render();

</script>
</body>
</html>
