<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="행운의 로또 번호 추첨기 - 당첨의 기운을 느껴보세요!">
    <title>로또 1등 추첨기</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7295785431183124"
     crossorigin="anonymous"></script>
    <style>
        :root {
            --gold: #ffcf4d;
            --neon: #00f2ff;
            --machine-size: 240px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #020617;
            font-family: -apple-system, 'Pretendard', 'Malgun Gothic', sans-serif;
            color: white;
            -webkit-font-smoothing: antialiased;
            touch-action: pan-y;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* 상단 광고 영역 */
        .ad-top {
            width: 100%;
            max-width: 728px;
            min-height: 90px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .header-area {
            width: 100%;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #win-text {
            text-align: center;
            opacity: 0;
            transform: translateY(20px) scale(0.8);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 0 20px;
        }

        #win-text.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #win-text h2 {
            font-size: clamp(1.3rem, 5vw, 1.8rem);
            margin: 0;
            line-height: 1.4;
            background: linear-gradient(to bottom, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 15px rgba(255, 207, 77, 0.5));
        }

        .machine-wrap {
            position: relative;
            width: var(--machine-size);
            height: var(--machine-size);
            margin: 10px 0 20px;
            max-width: 90vw;
            max-height: 90vw;
        }

        .machine {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5), 0 0 20px rgba(0,242,255,0.1);
            overflow: hidden;
            position: relative;
        }

        .inner-ball {
            position: absolute;
            width: 10%;
            height: 10%;
            border-radius: 50%;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3);
        }

        .result-box {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(6px, 2vw, 10px);
            min-height: 60px;
            margin: 25px 0;
            perspective: 1000px;
            justify-content: center;
            width: 100%;
            max-width: 400px;
            padding: 0 10px;
        }

        .ball {
            width: clamp(38px, 12vw, 46px);
            height: clamp(38px, 12vw, 46px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: rotateY(90deg) scale(0);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-shrink: 0;
        }

        .ball.active { 
            transform: rotateY(0) scale(1); 
        }

        .yellow { background: radial-gradient(circle at 30% 30%, #ffd93d, #f39c12); }
        .blue   { background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe); }
        .red    { background: radial-gradient(circle at 30% 30%, #ff5f6d, #ffc371); }
        .grey   { background: radial-gradient(circle at 30% 30%, #bdc3c7, #2c3e50); }
        .green  { background: radial-gradient(circle at 30% 30%, #42e695, #3bb2b8); }

        #draw-btn {
            padding: clamp(14px, 4vw, 18px) clamp(40px, 12vw, 60px);
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-weight: 700;
            color: #000;
            background: linear-gradient(135deg, #fff, #f0f0f0);
            border: none;
            border-radius: 100px;
            cursor: pointer;
            z-index: 101;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3), 0 0 20px rgba(255, 207, 77, 0.3);
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 20px;
        }

        #draw-btn:active { 
            transform: scale(0.95); 
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }
        
        #draw-btn:disabled { 
            opacity: 0.3; 
            cursor: not-allowed; 
        }

        /* 하단 광고 영역 */
        .ad-bottom {
            width: 100%;
            max-width: 728px;
            min-height: 90px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
        }

        @keyframes shake {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(3px, -3px) rotate(1deg); }
            50% { transform: translate(-3px, 3px) rotate(-1deg); }
            75% { transform: translate(3px, 3px) rotate(1deg); }
        }
        
        .shaking { 
            animation: shake 0.1s infinite; 
        }

        #fireworks {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            pointer-events: none;
            z-index: 90;
        }

        /* 모바일 최적화 */
        @media (max-width: 480px) {
            :root {
                --machine-size: 200px;
            }

            .container {
                padding: 15px;
            }

            .header-area {
                min-height: 80px;
            }

            .ad-top, .ad-bottom {
                min-height: 50px;
                font-size: 0.75rem;
            }

            .result-box {
                gap: 6px;
                margin: 20px 0;
            }

            .machine-wrap {
                margin: 5px 0 15px;
            }
        }

        /* 태블릿 최적화 */
        @media (min-width: 768px) {
            :root {
                --machine-size: 280px;
            }

            .container {
                justify-content: center;
            }
        }

        /* 가로 모드 */
        @media (orientation: landscape) and (max-height: 600px) {
            .container {
                padding: 10px;
            }

            .header-area {
                min-height: 60px;
            }

            .machine-wrap {
                margin: 5px 0;
            }

            .result-box {
                margin: 15px 0;
            }

            .ad-top, .ad-bottom {
                min-height: 60px;
            }
        }
    </style>
</head>
<body>

    <canvas id="fireworks"></canvas>

    <div class="container">
        <!-- 상단 광고 영역 -->
        <div class="ad-top">
            <!-- Google AdSense 코드 삽입 위치 -->
            광고 영역 (상단)
        </div>

        <div class="header-area">
            <div id="win-text">
                <h2>🎉 1등 당첨을<br>진심으로 축하드립니다!</h2>
            </div>
        </div>

        <div class="machine-wrap" id="machine-parent">
            <div class="machine" id="machine-body"></div>
        </div>

        <div class="result-box" id="result-display"></div>

        <button id="draw-btn">번호 추첨하기</button>

        <!-- 하단 광고 영역 -->
        <div class="ad-bottom">
            <!-- Google AdSense 코드 삽입 위치 -->
            광고 영역 (하단)
        </div>

        <!-- 사이트 설명 및 법적 고지 -->
        <p style="margin-top:30px; opacity:0.7; font-size:14px; text-align:center; max-width:600px; line-height:1.6;">
            본 사이트는 로또 번호를 무작위로 생성하는 개인용 번호 추첨기입니다.<br>
            실제 로또 당첨과는 무관하며, 참고용·엔터테인먼트 목적으로만 제공됩니다.
        </p>

        <!-- 하단 링크 -->
        <div style="margin-top:20px; margin-bottom:30px; text-align:center; font-size:14px;">
            <a href="about.html" style="color: rgba(255,255,255,0.7); text-decoration:none;">사이트 소개</a> |
            <a href="privacy.html" style="color: rgba(255,255,255,0.7); text-decoration:none;">개인정보처리방침</a>
        </div>
    </div>

<script>
    const machine = document.getElementById('machine-body');
    const resultBox = document.getElementById('result-display');
    const drawBtn = document.getElementById('draw-btn');
    const winText = document.getElementById('win-text');
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');

    const colors = ['#ffd93d', '#4facfe', '#ff5f6d', '#bdc3c7', '#42e695'];
    let idleBalls = [];
    let isCelebrating = false;
    let animationId = null;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    resize();

    // 기기별 볼 크기 계산
    function getMachineSize() {
        const machineEl = document.querySelector('.machine-wrap');
        return machineEl ? machineEl.offsetWidth : 240;
    }

    function initBalls() {
        machine.innerHTML = '';
        idleBalls = [];
        const size = getMachineSize();
        const ballSize = size * 0.1; // 10%
        const boundary = size - ballSize;

        for(let i=0; i<45; i++) {
            const b = document.createElement('div');
            b.className = 'inner-ball';
            b.style.backgroundColor = colors[Math.floor(i/10)] || colors[4];
            machine.appendChild(b);
            idleBalls.push({
                el: b,
                x: Math.random() * boundary,
                y: Math.random() * boundary,
                vx: (Math.random() - 0.5) * 3,
                vy: (Math.random() - 0.5) * 3
            });
        }
    }

    function update() {
        const size = getMachineSize();
        const ballSize = size * 0.1;
        const boundary = size - ballSize;

        idleBalls.forEach(b => {
            b.x += b.vx; 
            b.y += b.vy;
            if(b.x < 0 || b.x > boundary) b.vx *= -1;
            if(b.y < 0 || b.y > boundary) b.vy *= -1;
            b.el.style.transform = `translate3d(${b.x}px, ${b.y}px, 0)`;
        });
        animationId = requestAnimationFrame(update);
    }

    function getColClass(n) {
        if(n <= 10) return 'yellow'; 
        if(n <= 20) return 'blue';
        if(n <= 30) return 'red'; 
        if(n <= 40) return 'grey'; 
        return 'green';
    }

    async function startLotto() {
        isCelebrating = false;
        drawBtn.disabled = true;
        resultBox.innerHTML = '';
        winText.classList.remove('show');
        particles = []; 
        
        document.getElementById('machine-parent').classList.add('shaking');
        idleBalls.forEach(b => { 
            b.vx *= 4; 
            b.vy *= 4; 
        });

        let nums = [];
        while(nums.length < 6) {
            let n = Math.floor(Math.random() * 45) + 1;
            if(!nums.includes(n)) nums.push(n);
        }

        for(let i=0; i<6; i++) {
            await new Promise(r => setTimeout(r, 1000)); 
            const ball = document.createElement('div');
            ball.className = `ball ${getColClass(nums[i])}`;
            ball.innerText = nums[i];
            ball.dataset.num = nums[i];
            resultBox.appendChild(ball);
            setTimeout(() => ball.classList.add('active'), 50);
        }

        document.getElementById('machine-parent').classList.remove('shaking');
        idleBalls.forEach(b => { 
            b.vx /= 4; 
            b.vy /= 4; 
        });

        setTimeout(() => {
            const sorted = [...resultBox.children].sort((a,b) => a.dataset.num - b.dataset.num);
            resultBox.innerHTML = '';
            sorted.forEach(b => resultBox.appendChild(b));

            setTimeout(() => {
                winText.classList.add('show');
                burstConfetti();
                isCelebrating = true; 
                drawBtn.disabled = false;
            }, 800);
        }, 1000);
    }

    // 터치 이벤트 최적화
    drawBtn.addEventListener('click', startLotto);
    drawBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!drawBtn.disabled) {
            drawBtn.click();
        }
    }, { passive: false });

    let particles = [];
    const particleColors = ['#ffcf4d', '#ff5f6d', '#4facfe', '#42e695', '#ffffff', '#f39c12'];

    function burstConfetti() {
        const count = window.innerWidth < 768 ? 40 : 60; // 모바일에서는 파티클 수 감소
        for (let i = 0; i < count; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                size: Math.random() * 6 + 3,
                color: particleColors[Math.floor(Math.random() * particleColors.length)],
                vx: (Math.random() - 0.5) * 10, 
                vy: (Math.random() - 0.7) * 10, 
                angle: Math.random() * 360,
                spin: Math.random() * 8 - 4
            });
        }
    }

    function createConfetti() {
        if(!isCelebrating) return;
        if (Math.random() > 0.15) return; 

        particles.push({
            x: Math.random() * canvas.width,
            y: -20,
            size: Math.random() * 5 + 3,
            color: particleColors[Math.floor(Math.random() * particleColors.length)],
            vx: (Math.random() - 0.5) * 1.5,
            vy: Math.random() * 0.75 + 0.5, 
            angle: Math.random() * 360,
            spin: Math.random() * 4 - 2
        });
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (isCelebrating) createConfetti();

        particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.01; 
            p.angle += p.spin;
            
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle * Math.PI / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
            ctx.restore();

            if (p.y > canvas.height + 20) particles.splice(i, 1);
        });

        requestAnimationFrame(render);
    }

    // 초기화
    initBalls();
    update();
    render();

    // 화면 크기 변경 시 볼 재생성
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            initBalls();
        }, 250);
    });

</script>
</body>
</html>
